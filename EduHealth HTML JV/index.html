<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULSE ECG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            z-index: 1000;
            border-bottom: 2px solid #ff0000;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            letter-spacing: 2px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 20px 20px;
        }

        .welcome-screen {
            text-align: center;
            padding: 60px 0;
        }

        .welcome-title {
            font-size: 48px;
            font-weight: bold;
            color: #ff0000;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .welcome-subtitle {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .btn {
            background: linear-gradient(45deg, #ff0000, #cc0000);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.4);
            background: linear-gradient(45deg, #ff3333, #ff0000);
        }

        .form-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .form-title {
            font-size: 28px;
            color: #ff0000;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .pressure-group {
            display: flex;
            gap: 15px;
        }

        .pressure-group .form-group {
            flex: 1;
        }

        .records-container {
            margin-top: 30px;
        }

        .record-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            position: relative;
            transition: all 0.3s ease;
        }

        .record-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.2);
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .record-name {
            font-size: 20px;
            font-weight: bold;
            color: #ff0000;
        }

        .record-date {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .record-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .detail-item {
            text-align: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }

        .detail-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            margin-bottom: 5px;
        }

        .detail-value {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .no-records {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
            padding: 40px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">PULSE ECG</div>
    </header>

    <div class="container">
        <!-- Pantalla de Inicio -->
        <div id="welcomeScreen" class="welcome-screen">
            <h1 class="welcome-title">PULSE ECG</h1>
            <p class="welcome-subtitle">Sistema de Monitoreo Cardíaco</p>
            <button class="btn" onclick="showRegisterForm()">Registrar Paciente</button>
            <button class="btn" onclick="showRecords()">Ver Registros</button>
        </div>

        <!-- Formulario de Registro -->
        <div id="registerForm" class="hidden">
            <div class="form-container">
                <h2 class="form-title">Registro de Paciente</h2>
                <form onsubmit="savePatient(event)">
                    <div class="form-group">
                        <label for="name">Nombre Completo:</label>
                        <input type="text" id="name" name="name" placeholder="Ingrese el nombre completo" required>
                    </div>

                    <div class="form-group">
                        <label for="age">Edad:</label>
                        <input type="number" id="age" name="age" placeholder="Edad en años" min="1" max="120" required>
                    </div>

                    <div class="form-group">
                        <label for="weight">Peso (kg):</label>
                        <input type="number" id="weight" name="weight" placeholder="Peso en kilogramos" min="1" step="0.1" required>
                    </div>

                    <div class="form-group">
                        <label for="heartRate">Pulso Cardíaco (bpm):</label>
                        <input type="number" id="heartRate" name="heartRate" placeholder="Pulsaciones por minuto" min="30" max="250" required>
                    </div>

                    <div class="pressure-group">
                        <div class="form-group">
                            <label for="systolic">Presión Sistólica:</label>
                            <input type="number" id="systolic" name="systolic" placeholder="Presión alta" min="70" max="300" required>
                        </div>
                        <div class="form-group">
                            <label for="diastolic">Presión Diastólica:</label>
                            <input type="number" id="diastolic" name="diastolic" placeholder="Presión baja" min="40" max="200" required>
                        </div>
                    </div>

                    <div style="text-align: center; margin-top: 30px;">
                        <button type="submit" class="btn">Guardar Registro</button>
                        <button type="button" class="btn back-btn" onclick="showWelcome()">Volver</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Lista de Registros -->
        <div id="recordsList" class="hidden">
            <div class="form-container">
                <h2 class="form-title">Registros de Pacientes</h2>
                <div id="recordsContainer"></div>
                <div style="text-align: center; margin-top: 30px;">
                    <button class="btn back-btn" onclick="showWelcome()">Volver al Inicio</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Almacenamiento en memoria (reemplaza localStorage)
        let patients = [];

        function showWelcome() {
            document.getElementById('welcomeScreen').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('recordsList').classList.add('hidden');
        }

        function showRegisterForm() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('recordsList').classList.add('hidden');
        }

        function showRecords() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('recordsList').classList.remove('hidden');
            displayRecords();
        }

        function savePatient(event) {
            event.preventDefault();
            
            try {
                const formData = new FormData(event.target);
                const patient = {
                    id: Date.now(),
                    name: formData.get('name') || '',
                    age: parseInt(formData.get('age')) || 0,
                    weight: parseFloat(formData.get('weight')) || 0,
                    heartRate: parseInt(formData.get('heartRate')) || 0,
                    systolic: parseInt(formData.get('systolic')) || 0,
                    diastolic: parseInt(formData.get('diastolic')) || 0,
                    date: new Date().toLocaleDateString('es-ES', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    })
                };

                // Validar que los datos sean válidos
                if (!patient.name.trim()) {
                    alert('Por favor ingrese un nombre válido');
                    return;
                }

                patients.push(patient);
                
                // Limpiar formulario
                event.target.reset();
                
                alert('¡Paciente registrado exitosamente!');
                showWelcome();
            } catch (error) {
                console.error('Error al guardar paciente:', error);
                alert('Ocurrió un error al guardar el paciente. Por favor intente nuevamente.');
            }
        }

        function displayRecords() {
            const container = document.getElementById('recordsContainer');
            
            try {
                if (!patients || patients.length === 0) {
                    container.innerHTML = '<div class="no-records">No hay registros de pacientes</div>';
                    return;
                }

                container.innerHTML = patients.map(patient => {
                    // Validar que el paciente tenga los datos necesarios
                    const safeName = patient.name || 'Sin nombre';
                    const safeAge = patient.age || 0;
                    const safeWeight = patient.weight || 0;
                    const safeHeartRate = patient.heartRate || 0;
                    const safeSystolic = patient.systolic || 0;
                    const safeDiastolic = patient.diastolic || 0;
                    const safeDate = patient.date || 'Sin fecha';
                    
                    return `
                        <div class="record-card">
                            <div class="record-header">
                                <div class="record-name">${safeName}</div>
                                <div class="record-date">${safeDate}</div>
                            </div>
                            <div class="record-details">
                                <div class="detail-item">
                                    <div class="detail-label">EDAD</div>
                                    <div class="detail-value">${safeAge} años</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">PESO</div>
                                    <div class="detail-value">${safeWeight} kg</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">PULSO</div>
                                    <div class="detail-value">${safeHeartRate} bpm</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">PRESIÓN</div>
                                    <div class="detail-value">${safeSystolic}/${safeDiastolic}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error al mostrar registros:', error);
                container.innerHTML = '<div class="no-records">Error al cargar los registros</div>';
            }
        }

        // Inicializar la aplicación
        showWelcome();
    </script>
</body>
</html>
